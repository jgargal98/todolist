name: Build and deploy ASP.Net Core app to Azure Web App - todolist-jgg

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - name: Set up .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.x"

            - name: Build with dotnet
              run: dotnet build --configuration Release
              working-directory: ./backend

            - name: dotnet publish
              run: dotnet publish -c Release -o ../publish
              working-directory: ./backend

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v4
              with:
                  name: .net-app
                  path: ./publish

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v4
              with:
                  name: .net-app
                  path: ./ready-to-deploy

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99D36C1BF4C2480DA368914994BDE308 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7A57A0A94EB0415FBEC09EF40BDD02E4 }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5E3005A90DE43BCBEEE2B4B96E578D6 }}

            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: "todolist-jgg"
                  slot-name: "Production"
                  # Importante: Desplegamos la carpeta donde descargamos el artefacto
                  package: ./ready-to-deploy
